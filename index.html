<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>File Storage Tracker</title>

<style>
    body {
        margin: 0;
        font-family: "Poppins", sans-serif;
        background: #e8f1ff;
        color: #0d2c54;
    }

    header {
        background: linear-gradient(135deg, #1d4ed8, #60a5fa);
        padding: 25px;
        text-align: center;
        color: white;
        font-size: 28px;
        font-weight: 600;
        box-shadow: 0 4px 15px rgba(0,0,0,0.2);
    }

    .container {
        max-width: 900px;
        margin: 40px auto;
        background: white;
        padding: 30px;
        border-radius: 16px;
        box-shadow: 0 6px 20px rgba(0,0,0,0.1);
        transition: 0.3s;
    }

    .container:hover {
        transform: translateY(-3px);
        box-shadow: 0 12px 25px rgba(0,0,0,0.15);
    }

    label {
        font-weight: 600;
        margin-top: 10px;
        display: block;
    }

    input, textarea {
        width: 100%;
        padding: 12px;
        margin-top: 6px;
        border-radius: 10px;
        border: 1px solid #b8c7e0;
        font-size: 15px;
        outline: none;
        transition: 0.2s;
    }

    input:focus, textarea:focus {
        border-color: #1d4ed8;
        box-shadow: 0 0 10px rgba(29, 78, 216, 0.3);
    }

    button {
        background: #1d4ed8;
        color: white;
        padding: 12px 20px;
        border: none;
        border-radius: 10px;
        margin-top: 15px;
        cursor: pointer;
        font-size: 16px;
        transition: 0.3s;
        box-shadow: 0 5px 15px rgba(29,78,216,0.4);
    }

    button:hover {
        background: #153eac;
        transform: translateY(-2px);
    }

    #searchBar {
        width: 100%;
        padding: 15px;
        font-size: 18px;
        margin-top: 40px;
        border-radius: 12px;
        border: 2px solid #1d4ed8;
        outline: none;
        box-shadow: 0 4px 10px rgba(29,78,216,0.3);
    }

    .file-card {
        background: #f5f9ff;
        padding: 20px;
        margin-top: 20px;
        border-radius: 14px;
        box-shadow: 0 3px 10px rgba(0,0,0,0.1);
        transition: 0.3s;
    }

    .file-card:hover {
        transform: scale(1.02);
        box-shadow: 0 6px 20px rgba(0,0,0,0.15);
    }

    .title {
        font-size: 22px;
        font-weight: 700;
        color: #1d4ed8;
    }

    .info {
        margin-top: 8px;
        line-height: 1.6;
    }
</style>
</head>
<body>

<header>📁 File Storage Tracker</header>

<div class="container">
    <h2>Add New File</h2>

    <label>Title:</label>
    <input type="text" id="title">

    <label>Storage Number / Location:</label>
    <input type="text" id="storage">

    <label>Extra Information (optional):</label>
    <textarea id="info" rows="4"></textarea>

    <button onclick="addFile()">Upload File</button>
</div>

<div class="container">
    <h2>Search Files</h2>
    <input type="text" id="searchBar" placeholder="Search by title..." onkeyup="searchFiles()">
    <div id="results"></div>
</div>

<script>
    let files = [];

    function addFile() {
        const title = document.getElementById("title").value;
        const storage = document.getElementById("storage").value;
        const info = document.getElementById("info").value;

        if (!title || !storage) {
            alert("Title and Storage are required!");
            return;
        }

        files.push({ title, storage, info });

        document.getElementById("title").value = "";
        document.getElementById("storage").value = "";
        document.getElementById("info").value = "";

        alert("File uploaded!");
    }

    function searchFiles() {
        const query = document.getElementById("searchBar").value.toLowerCase();
        const resultsDiv = document.getElementById("results");
        resultsDiv.innerHTML = "";

        const filtered = files.filter(f => f.title.toLowerCase().includes(query));

        filtered.forEach(file => {
            const card = document.createElement("div");
            card.className = "file-card";

            card.innerHTML = `
                <div class="title">${file.title}</div>
                <div class="info"><b>Storage:</b> ${file.storage}</div>
                <div class="info"><b>Info:</b> ${file.info || "None"}</div>
            `;

            resultsDiv.appendChild(card);
        });
    }
</script>

</body>
</html>
